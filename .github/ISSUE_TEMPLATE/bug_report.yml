name: Bug report
description: Report a reproducible issue with @n0ctanedev/starlight-n0ct.
body:
  - type: input
    id: versions
    attributes:
      label: Astro and Starlight versions
      placeholder: Astro 7.2.10+, Starlight 0.42.10 or 0.43.x
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
